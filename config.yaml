midi:
  input_port: auto
  output_port: RK006 OUT_ALL
  input_channel: 1
  output_channel: 0 
  clock:
    enabled: true
    send_start_stop: true
    send_song_position: true
  cc_profile:
    active_profile: roland_jx08
    parameter_smoothing: true
    cc_throttle_ms: 10
hid:
  device_name: Generic USB Joystick
  button_mapping:
    0: trigger_step
    1: trigger_step
    2: trigger_step
    3: trigger_step
    4: trigger_step
    5: trigger_step
    6: trigger_step
    7: trigger_step
    8: trigger_step
    9: trigger_step
  joystick_mapping:
    up: tempo_up
    down: tempo_down
    left: direction_left
    right: direction_right
mapping:
  buttons: {}
  ccs:
    '2': sequence_length
    '27': tempo
    '21': filter_cutoff
    '22': filter_resonance
    '23': eg_attack
    '24': eg_release
    '25': reverb_mix
    '26': delay_mix
    '50': tempo_up
    '51': tempo_down
    '52': direction_left
    '53': direction_right
    '60': osc_type
    '61': filter_type
    '62': mod_type
sequencer:
  steps: 8
  bpm: 90.0
  swing: 0.09
  density: 0.01
  root_note: 52
  gate_length: 0.1
  quantize_scale_changes: bar
  step_pattern: syncopated
  direction_pattern: song
  voices: 4
  note_division: quarter
scales:
- major
- minor
- blues
- pentatonic_major
- pentatonic_minor
- mixolydian
- dorian
- locrian
mutation:
  interval_min_s: 10
  interval_max_s: 15
  max_changes_per_cycle: 3
idle:
  timeout_ms: 300000
  ambient_profile: meditative
  fade_in_ms: 10000
  fade_out_ms: 1000
  smooth_bpm_transitions: true
  bpm_transition_duration_s: 30.0
synth:
  backend: supercollider
  voices: 8
logging:
  level: DEBUG
api:
  enabled: true
  port: 8080
  host: 0.0.0.0
  log_level: info
cc_profiles: {}
